[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "govt_hr_payroll"
authors = [
    { name = "NexGen ERP Technologies", email = "support@nexgenerptechnologies.com" }
]
description = "Comprehensive 7th Central Pay Commission (7th CPC) Government HR & Payroll System for Frappe Framework v16"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "frappe"
]

[project.urls]
Homepage = "https://github.com/nexgenerptechnologies/govt-hr-and-payroll"
Repository = "https://github.com/nexgenerptechnologies/govt-hr-and-payroll.git"
